[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "goassay"
version = "0.0.0"
description = "Call tools through Assay over MCP, with free and paid calls signed by your own key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["eth-account>=0.13,<0.15", "httpx>=0.27,<1"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0"]

[project.urls]
Homepage = "https://github.com/assay-ai/assay-sdk"
Source = "https://github.com/assay-ai/assay-sdk/tree/main/python"
Issues = "https://github.com/assay-ai/assay-sdk/issues"
Documentation = "https://docs.goassay.ai/developers"

[tool.hatch.build.targets.wheel]
packages = ["src/goassay"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
